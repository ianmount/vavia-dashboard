<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Dumpster body -->
  <rect x="6" y="18" width="36" height="24" rx="2" fill="#8B5E3C"/>
  <!-- Dumpster lid (left panel) -->
  <rect x="6" y="12" width="16" height="7" rx="1.5" fill="#6B4226" transform="rotate(-10 14 16)"/>
  <!-- Dumpster lid (right panel) -->
  <rect x="26" y="12" width="16" height="7" rx="1.5" fill="#6B4226" transform="rotate(10 34 16)"/>
  <!-- Front panel lines -->
  <line x1="16" y1="18" x2="16" y2="42" stroke="#6B4226" stroke-width="1.5"/>
  <line x1="32" y1="18" x2="32" y2="42" stroke="#6B4226" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="13" cy="43" r="3" fill="#3B2A1A"/>
  <circle cx="35" cy="43" r="3" fill="#3B2A1A"/>
  <!-- Wheel highlights -->
  <circle cx="13" cy="43" r="1.2" fill="#5C3D22"/>
  <circle cx="35" cy="43" r="1.2" fill="#5C3D22"/>
  <!-- Handle bar -->
  <rect x="18" y="10" width="12" height="2.5" rx="1.25" fill="#4A2E14"/>
</svg>
